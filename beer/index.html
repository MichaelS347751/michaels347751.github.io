<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beer With Friends</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:#f6f1e7;color:#2b2b2b;display:flex;align-items:center;
       justify-content:center;min-height:100vh;margin:0;text-align:center;padding:24px}
  .card{max-width:420px}
  h1{font-size:1.5rem;margin:0 0 8px}
  p{line-height:1.5;margin:8px 0}
</style>
<script>
  (function () {
    var id = new URLSearchParams(window.location.search).get('id');
    if (id && /^[A-Za-z0-9_-]+$/.test(id)) {
      window.location.replace('beerswithfriends://post?id=' + encodeURIComponent(id));
    }
    if (id) { document.getElementById('post').textContent = 'Post: ' + id; }
  })();
</script>
</head>
<body>
  <div class="card">
    <h1>🍻 Beer With Friends</h1>
    <p>Opening the shared drink post…</p>
    <p><span id="post"></span></p>
    <p style="color:#777;font-size:0.9rem">If nothing happens, the Beer With
    Friends app isn't installed (or wasn't able to open) on this device.</p>
  </div>
</body>
</html>
